# Build della galleria (Vite) e deploy su GitHub Pages.
# - build: eseguita sui push a master/test-vue e sulle PR verso master (validazione)
# - deploy: SOLO sui push a master (pubblica ./dist sul branch gh-pages)
name: CI

on:
  push:
    branches: [ "master", "test-vue" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        node-version: [20.x]
        # Vedi il calendario delle release Node: https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy to GitHub Pages
        # Deploy solo quando si spinge su master (mai su PR o su altri branch).
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Mantiene su gh-pages solo l'ultimo build (niente storia): evita che il
          # branch di deploy si gonfi, dato il peso dei media.
          force_orphan: true
