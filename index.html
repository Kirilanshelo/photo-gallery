<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Galleria Fotografica</title>
    <meta
      name="description"
      content="Galleria fotografica di viaggio: Giappone e Thailandia. Sfoglia le foto per album e guardale a schermo intero."
    />
    <meta name="theme-color" content="#331d1d" />

    <!-- Icone -->
    <link rel="icon" href="/favicon.ico" sizes="any" />

    <!-- Open Graph: anteprima quando il link viene condiviso
         (WhatsApp, Telegram, Facebook, LinkedIn, Discord, iMessage, ...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Galleria Fotografica" />
    <meta property="og:title" content="Galleria Fotografica" />
    <meta
      property="og:description"
      content="Galleria fotografica di viaggio: Giappone e Thailandia."
    />
    <meta
      property="og:url"
      content="https://kirilanshelo.github.io/photo-gallery/"
    />
    <!-- NB: og:image deve essere un URL ASSOLUTO. Aggiungi public/og-image.jpg
         (consigliato 1200x630) affinche' l'anteprima mostri l'immagine. -->
    <meta
      property="og:image"
      content="https://kirilanshelo.github.io/photo-gallery/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="it_IT" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Galleria Fotografica" />
    <meta
      name="twitter:description"
      content="Galleria fotografica di viaggio: Giappone e Thailandia."
    />
    <meta
      name="twitter:image"
      content="https://kirilanshelo.github.io/photo-gallery/og-image.jpg"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
